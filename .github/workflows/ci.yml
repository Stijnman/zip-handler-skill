name: CI

on:
  push:
    branches: [ main, chore/zip-safety-refactor ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install dev tools
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check . || true
      - name: Run pytest
        run: pytest -q
      - name: Generate sample zip for benchmark
        run: python3 tests/fixtures/generate_sample.py
      - name: Run benchmark (optional, non-blocking)
        run: |
          python3 scripts/benchmark.py tests/fixtures/sample.zip artifacts/bench || true
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: benchmark_result.json
